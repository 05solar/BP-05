
baseURL = 'https://05solar.github.io/BP-05/'
languageCode = 'ko'
title = '05solar Portfolio'
# 로컬 미리보기(hugo server)에서도 테마가 적용되도록 지정.
# 배포 빌드는 pages.json이 같은 값을 다시 지정하므로 충돌 없음.
theme = 'template'

enableRobotsTXT = true

[params]
  description = '전북대학교 IT지능정보공학과에 재학 중인 풀스택 개발자 이솔하의 개인 포트폴리오'
  email = 'lotus05f@gmail.com'
  location = '전북대학교'

[params.homepage]
  sections = ["hero", "news", "research", "writing"]

  [params.homepage.hero]
    enable = true
    layout = "hero"
    title = "About"

  [params.homepage.news]
    enable = true
    layout = "news"
    title = "News"

  [params.homepage.research]
    enable = true
    layout = "cards"
    title = "Research"

  [params.homepage.writing]
    enable = true
    layout = "grid"
    title = "Writing"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        enableInShortcodes = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["\\[", "\\]"],
            ["$$", "$$"]
          ]
          inline = [
            ["\\(", "\\)"],
            ["$", "$"]
          ]
  [markup.highlight]
    style = "friendly"
    noClasses = false
    lineNos = true
    guessSyntax = true

# ---------------------------------------------------------
# CASCADING DEFAULTS
# This applies settings to ALL files in the 'content' folder
# ---------------------------------------------------------

[[cascade]]
  layout = "single"      # 1. The Rule: Use single.html
  [cascade._target]
    path = "/**"         # 2. The Scope: Inside any folder (** = "Recursive" - go as deep as you want)
    kind = "page"        # 3. The Filter: But ONLY for regular text files (not list nor home pages)
