summary: >
  안녕하세요, 이솔하입니다. 전북대학교 **IT지능정보공학과**에 재학 중입니다.
  ==풀스택 웹 개발==과 ==AI 활용 기술==에 관심을 가지고 다양한 프로젝트를 진행하고 있습니다.


  웹 기초를 배우며 만든 화면이 실제로 동작하는 서비스가 되는 과정이 즐거워
  프론트엔드에서 백엔드·배포까지 직접 다루는 ==풀스택 개발==에 관심을 갖게 되었고,
  캡스톤에서 사람이 현미경으로 하던 검사를 AI로 자동화해 보며 ==AI 기술이 실제 현장의
  문제를 해결하는 힘==을 경험한 뒤로 AI 활용 기술을 함께 공부하고 있습니다.
  LLM, RAG, MCP(Model Context Protocol) 기반 AI 서비스 개발 경험을 보유하고 있으며,
  프론트엔드부터 백엔드, AI 시스템 연동까지 전반적인 개발 역량을 갖추고 있습니다.
